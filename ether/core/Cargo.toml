[package]
name = "ether_core"
version = "0.1.0"
edition = "2021"
description = "The conductor of the virtual ether's virtual-time runs, for ether.py"
publish = false

[lib]
name = "ether_core"
crate-type = ["cdylib"]

[dependencies]
libc = "0.2"
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
