          classes: { 11: water, 12: open, 21: low-vegetation, 22: suburban, 23: suburban,
                     24: urban, 31: open, 41: forest, 42: forest, 43: forest,
                     52: low-vegetation, 71: low-vegetation, 81: open, 82: open, 90: forest,
